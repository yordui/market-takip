name: Otomatik Fiyat Kontrolu

on:
  schedule:
    - cron: '0 6,9,12,15,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-price-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install requests

      - name: Fiyat Kontrol Betigini Calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python check_prices.py

      - name: Veritabani Guncellemelerini Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f market.db ]; then
            git add market.db
            git diff --staged --quiet || (git commit -m "Otomatik fiyat guncellemesi [skip ci]" && git push)
          fi